databases:
  - name: lupineandleash-db
    plan: free
    databaseName: lupineandleash
    user: lupineandleash

services:
  # Spring Boot backend (API)
  - type: web
    name: lupineandleash-backend
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_HOST
        fromDatabase:
          name: lupineandleash-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: lupineandleash-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: lupineandleash-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: lupineandleash-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: lupineandleash-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: PAYPAL_MODE
        value: sandbox
      - key: PAYPAL_BASE_URL
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: CJ_API_ENABLED
        value: "false"
      - key: CJ_API_KEY
        sync: false
      - key: CJ_AUTO_SUBMIT_ON_PAID
        value: "true"
      - key: CJ_AUTO_SUBMIT_ON_CREATE
        value: "false"
      - key: CJ_FULFILLMENT_SYNC_ENABLED
        value: "false"
      - key: CJ_WEBHOOK_SECRET
        sync: false

  # Vite/React frontend (static site)
  - type: web
    name: lupineandleash-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
