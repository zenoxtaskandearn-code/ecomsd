databases:
  - name: lupineandleash-db
    plan: free
    databaseName: lupineandleash
    user: lupineandleash

services:
  # Spring Boot backend (API)
  - type: web
    name: lupineandleash-backend
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_HOST
        fromDatabase:
          name: lupineandleash-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: lupineandleash-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: lupineandleash-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: lupineandleash-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: lupineandleash-db
          property: password
      - key: DB_SSLMODE
        value: require
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: https://lupineandleash-frontend.onrender.com
      - key: PAYPAL_MODE
        value: sandbox
      - key: PAYPAL_BASE_URL
        value: https://api-m.sandbox.paypal.com
      - key: PAYPAL_CLIENT_ID
        value: ""
      - key: PAYPAL_CLIENT_SECRET
        value: ""
      - key: PAYPAL_WEBHOOK_ID
        value: ""
      - key: CJ_API_ENABLED
        value: "false"
      - key: CJ_API_KEY
        value: ""
      - key: CJ_WEBHOOK_SECRET
        value: ""
      - key: CJ_AUTO_SUBMIT_ON_PAID
        value: "true"
      - key: CJ_AUTO_SUBMIT_ON_CREATE
        value: "false"
      - key: CJ_FULFILLMENT_SYNC_ENABLED
        value: "true"
      - key: CJ_FULFILLMENT_SYNC_DELAY_MS
        value: "900000"
      - key: CJ_FULFILLMENT_SYNC_INITIAL_DELAY_MS
        value: "120000"
      - key: CJ_FULFILLMENT_SYNC_BATCH_SIZE
        value: "10"
      - key: CJ_ORDER_CREATE_PATH
        value: /shopping/order/createOrderV2
      - key: CJ_FROM_COUNTRY_CODE
        value: "CN"
      - key: CJ_LOGISTIC_NAME
        value: ""

  # Vite/React frontend (static site)
  - type: web
    name: lupineandleash-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      - key: VITE_API_BASE_URL
        value: https://lupineandleash-backend.onrender.com/api/v1
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
