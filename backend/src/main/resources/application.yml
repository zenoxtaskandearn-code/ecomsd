spring:
  application:
    name: lupineandleash-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jackson:
    default-property-inclusion: non_null
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  frontend-base-url: ${FRONTEND_BASE_URL:https://lupineandleash-frontend.onrender.com}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  jwt:
    secret: ${JWT_SECRET:local-dev-secret-replace-with-32-plus-random-chars}
    access-ttl-seconds: ${JWT_ACCESS_TTL_SECONDS:900}
    refresh-ttl-seconds: ${JWT_REFRESH_TTL_SECONDS:2592000}
  paypal:
    mode: ${PAYPAL_MODE:sandbox}
    base-url: ${PAYPAL_BASE_URL:https://api-m.sandbox.paypal.com}
    client-id: ${PAYPAL_CLIENT_ID:}
    client-secret: ${PAYPAL_CLIENT_SECRET:}
    webhook-id: ${PAYPAL_WEBHOOK_ID:}
  notifications:
    email-enabled: ${EMAIL_NOTIFICATIONS_ENABLED:false}
    provider: ${EMAIL_PROVIDER:emailjs}
    process-enabled: ${EMAIL_NOTIFICATIONS_PROCESS_ENABLED:true}
    process-delay-ms: ${EMAIL_NOTIFICATIONS_PROCESS_DELAY_MS:30000}
    emailjs:
      service-id: ${EMAILJS_SERVICE_ID:}
      template-id: ${EMAILJS_TEMPLATE_ID:}
      public-key: ${EMAILJS_PUBLIC_KEY:}
      private-key: ${EMAILJS_PRIVATE_KEY:}
