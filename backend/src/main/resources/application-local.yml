spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/fetch?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate

logging:
  level:
    com.fetch.backend: INFO
    org.springframework.security: INFO
